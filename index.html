<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구역장님 어디세이?</title>
    <style>
        * { box-sizing: border-box; 
           margin: 0; padding: 0; 
           font-family: 'Pretendard', -apple-system, sans-serif; 
          }
        body {
            position: relative;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
            overflow-x : hidden; /* 배경확대로 인한 스크롤 방지 */
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            /* 로고 이미지 설정 */
            background-image: url('./logo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 600px auto; /* 로고 크기조절 */

            opacity: 0.08; /* 반투명도 조절 */

            z-index: -1; /* 카드형 컨텐츠 뒤로 */
            pointer-events: none;
        }
        
        .card { background: #ffffff;
               width: 100%;
               max-width: 420px; 
               padding: 24px 16px 20px;
               border-radius: 16px;
               box-shadow: 0 8px 24px rgba(0,0,0,0.08);
              }
        h1 { font-size: 1.4rem; 
            color: #111;
            margin-bottom: 20px; 
            text-align: center; 
           }

        /* 입력창 영역이 카드를 넘지 않도록 너비 100% 및 내부 여백 조절 */
        .input-group { display: flex; 
                      gap: 8px; 
                      margin-bottom: 24px; 
                      width: 100%; }
        input { flex: 1; 
               min-width: 0; 
               padding: 12px 16px; 
               border: 1px solid #ddd; 
               border-radius: 8px; font-size: 1rem; 
               outline: none; 
              }
        input:focus { border-color: #007bff; }
        
        .btn { 
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            flex-shrink: 0; /* 버튼 크기 줄어듦 방지 */
        }
        .btn:hover { background-color: #0056b3; }

        .result-box { display: none; margin-top: 10px; }
        .user-name { font-size: 1.2rem; font-weight: bold; color: #007bff; margin-bottom: 20px; text-align: center; }
        
        .timeline { position: relative; padding-left: 20px; border-left: 2px solid #e0e0e0; margin-left: 10px; }
        .step { position: relative; margin-bottom: 20px; display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        
        .step::before { content: ''; position: absolute; left: -26px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #007bff; }
        .step.destination::before { background: #28a745; width: 12px; height: 12px; left: -27px; }
        
        .label { font-size: 0.8rem; color: #666; display: block; margin-bottom: 2px; }
        .value { font-size: 1.1rem; font-weight: 600; color: #222; }
        .destination .value { color: #28a745; font-size: 1.2rem; }
        
        .guide-banner { margin-top: 20px; padding: 14px; background-color: #e7f3ff; border-radius: 8px; border-left: 4px solid #007bff; color: #004085; font-size: 0.9rem; text-align: center; line-height: 1.4; }
        .guide-banner.completed { background-color: #d4edda; border-left-color: #28a745; color: #155724; }
        .guide-banner.warning { background-color: #fff3cd; border-left-color: #ffc107; color: #856404; }

        .error-msg { color: #dc3545; text-align: center; font-size: 0.95rem; display: none; margin-top: 10px; }

        /* 예외 처리 버튼 스타일 */

        .footer-help {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #e9ecef;
            text-align: center;
        }
        .manual-btn {
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            color: #6c757d;
            font-size: 0.8rem;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .manual-btn:hover {
            background: #e9ecef;
            color: #495057;
            border-color: #cbd5e1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🚩 개인별 코스 안내</h1>
    
    <div class="input-group" id="searchArea">
        <input type="text" id="nameInput" placeholder="이름을 입력하세요 (예: 나전원)">
        <button class="btn" onclick="startRoute()" aria-label="조회">🔍</button>
    </div>

    <div id="errorMsg" class="error-msg">이름을 입력해 주세요.</div>

    <div id="resultBox" class="result-box">
        <div id="userNameDisplay" class="user-name"></div>
        
        <div class="timeline">
            <div id="step1" class="step">
                <span class="label" id="lbl1">1차 장소</span>
                <span id="p1" class="value"></span>
            </div>
            <div id="step2" class="step">
                <span class="label" id="lbl2">2차 장소</span>
                <span id="p2" class="value"></span>
            </div>
            <div id="step3" class="step">
                <span class="label" id="lbl3">3차 장소</span>
                <span id="p3" class="value"></span>
            </div>
            <div id="step4" class="step destination">
                <span class="label" id="lbl4">최종 목적지</span>
                <span id="p4" class="value"></span>
            </div>
        </div>

        <div id="guideBanner" class="guide-banner">
            📍 지정된 장소에 도착하여 미션을 완료한 후<br><strong>현장의 QR 코드</strong>를 스캔해 주세요!
        </div>

        <!-- 카메라/스캔 문제 처리 버튼 -->
        <div class="footer-help">
            <button type="button" class="manual-btn" onclick="openStaffAuth()">
                <span>❓</span> 스캔 오류 발생 시 (스태프 인증)
            </button>
        </div>
    </div>
</div>

<script>
    // 운영용 관리자 비밀번호 (원하는 비밀번호로 변경하세요)
    const ADMIN_PASSWORD = "1122";
    
    // 사용자별 "최종 목적지" 지정 (중간 경유지는 아래 장소 목록에서 중복 없이 3개 랜덤 추출)
    const fixedDestinations = {
        "박진아": "농구골대",
        "유태영": "농구골대",
        "김소희": "농구골대",
        "이범교": "농구골대",
        "배민선": "농구골대",
        "윤휘람" : "음악당",
        "이은서" : "음악당",
        "이동구" : "음악당",
        "공소라" : "음악당",
        "박예찬" : "음악당",
        "안하원" : "음악당",
        "김소정": "침례장",
        "석성훈": "침례장",
        "윤예진": "침례장",
        "홍지원": "침례장",
        "배민우": "침례장",
        "김혜민": "로비",
        "이시": "로비",
        "원유진": "로비",
        "조민희": "로비",
        "성민석": "로비",
        "조건희": "로비"
    };

    // 경유지 및 목적지 풀
    const allLocationsPool = [
        "음악당", "농구골대", "침례장", "로비"
    ];

    const EXPIRE_TIME = 24 * 60 * 60 * 1000; // 24시간 후 초기화

    function getRandomItems(arr, count) {
        const shuffled = [...arr].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function checkAndClearExpiredData(name) {
        const savedTime = localStorage.getItem(`saved_time_${name}`);
        const now = new Date().getTime();

        if (savedTime && (now - parseInt(savedTime) > EXPIRE_TIME)) {
            localStorage.removeItem(`route_data_${name}`);
            localStorage.removeItem(`completed_step_${name}`);
            localStorage.removeItem(`saved_time_${name}`);
            if (localStorage.getItem("route_user_name") === name) {
                localStorage.removeItem("route_user_name");
            }
            return true;
        }
        return false;
    }

    function startRoute(providedName = null) {
        const nameInput = document.getElementById("nameInput");
        const name = providedName || nameInput.value.trim();
        const resultBox = document.getElementById("resultBox");
        const errorMsg = document.getElementById("errorMsg");

        if (!name) {
            errorMsg.textContent = "이름을 입력해 주세요.";
            errorMsg.style.display = "block";
            resultBox.style.display = "none";
            return;
        }

        const isExpired = checkAndClearExpiredData(name);
        const now = new Date().getTime();
        
        if (!localStorage.getItem(`saved_time_${name}`) || isExpired) {
            localStorage.setItem(`saved_time_${name}`, now);
        }

        localStorage.setItem("route_user_name", name);
        nameInput.value = name;

        // 코스 생성 로직
        let routeData = [];
        const savedRoute = localStorage.getItem(`route_data_${name}`);
        if (savedRoute) {
            routeData = JSON.parse(savedRoute);
        } else {
            let finalDest = "";

            // 1. 최종 목적지 결정 (명단에 있으면 고정값, 없으면 전체 장소 중 랜덤 1개)
            if (fixedDestinations[name]) {
                finalDest = fixedDestinations[name];
            } else {
                finalDest = getRandomItems(allLocationsPool, 1)[0];
            }

            // 2. 최종 목적지를 제외한 후보군에서 중간 경유지 3개 추출
            const availableWaypoints = allLocationsPool.filter(loc => loc !== finalDest);
            const waypoints = getRandomItems(availableWaypoints, 3);

            // 3. [1차, 2차, 3차, 최종 목적지] 배열 완성
            routeData = [...waypoints, finalDest];
            localStorage.setItem(`route_data_${name}`, JSON.stringify(routeData));
        }

        document.getElementById("userNameDisplay").textContent = `[ ${name} ] 님의 이동 코스`;
        document.getElementById("p1").textContent = routeData[0];
        document.getElementById("p2").textContent = routeData[1];
        document.getElementById("p3").textContent = routeData[2];
        document.getElementById("p4").textContent = routeData[3];

        // QR 인증 로직
        const scannedLocation = getQueryParam("loc");
        // completedStep: 완료한 단계 수 (0 = 시작 전, 1 = 1차 완료, 4 = 전체 완료)
        let completedStep = parseInt(localStorage.getItem(`completed_step_${name}`)) || 0;
        let statusMessage = "";
        let bannerStatus = "";

        if (scannedLocation) {
            if (completedStep < 4) {
                const targetLocation = routeData[completedStep]; // 이번에 방문해야 할 장소

                if (scannedLocation === targetLocation) {
                    completedStep++;
                    localStorage.setItem(`completed_step_${name}`, completedStep);

                    if (completedStep === 4) {
                        statusMessage = `🎉 <strong>최종 목적지 [${scannedLocation}] 도착 완료!</strong><br>모든 코스를 마쳤습니다. 수고하셨습니다!`;
                        bannerStatus = "completed";
                    } else {
                        statusMessage = `✅ <strong>[${scannedLocation}] 인증 완료!</strong><br>다음 장소(${completedStep + 1}차)가 열렸습니다.`;
                    }
                } else {
                    // 이미 완료한 장소 스캔 시
                    const alreadyDone = routeData.slice(0, completedStep).includes(scannedLocation);
                    if (alreadyDone) {
                        statusMessage = `ℹ️ 이미 인증을 마친 장소 [${scannedLocation}] 입니다.`;
                        bannerStatus = "warning";
                    } else {
                        statusMessage = `⚠️ 순서가 다릅니다!<br>현재 이동할 곳은 <strong>[${targetLocation}]</strong> 입니다.`;
                        bannerStatus = "warning";
                    }
                }
            } else {
                statusMessage = `🎉 이미 모든 코스 인증을 완료했습니다!`;
                bannerStatus = "completed";
            }
        }

        // 화면 UI 갱신
        // (현재 진행해야 하는 단계까지 오픈 + 다음 목적지까지 미리 노출)
        const activeStepLimit = Math.min(completedStep + 1, 4);
        for (let i = 1; i <= 4; i++) {
            const stepEl = document.getElementById(`step${i}`);
            if (i <= activeStepLimit) {
                stepEl.classList.add("active");
            } else {
                stepEl.classList.remove("active");
            }
        }

        // 배너 문구 설정
        const guideBanner = document.getElementById("guideBanner");
        if (completedStep === 4) {
            guideBanner.className = "guide-banner completed";
            guideBanner.innerHTML = statusMessage || "🎉 <strong>모든 코스를 완주했습니다!</strong>";
        } else {
            guideBanner.className = bannerStatus ? `guide-banner ${bannerStatus}` : "guide-banner";
            const nextPlace = routeData[completedStep];
            guideBanner.innerHTML = statusMessage || `📍 <strong>[${nextPlace}]</strong>에 도착하여 QR 코드를 스캔해 주세요!`;
        }

        errorMsg.style.display = "none";
        resultBox.style.display = "block";
    }
    
    // 관리자/스태프 강제 승인 처리 로직
    function openStaffAuth() {
        const savedName = localStorage.getItem("route_user_name");
        if (!savedName) {
            alert("먼저 이름을 입력하고 코스를 조회해 주세요.");
            return;
        }

        let completedStep = parseInt(localStorage.getItem(`completed_step_${savedName}`)) || 0;
        if (completedStep >= 4) {
            alert("이미 모든 코스를 완료한 사용자입니다.");
            return;
        }

        const routeData = JSON.parse(localStorage.getItem(`route_data_${savedName}`));
        const currentTarget = routeData[completedStep]; // 현재 방문해야 할 장소

        const inputPw = prompt(`[스태프 전용]\n현재 인증 단계: ${completedStep + 1}차 [${currentTarget}]\n\n관리자 비밀번호를 입력하세요:`);

        if (inputPw === null) return; // 취소 누름

        if (inputPw === ADMIN_PASSWORD) {
            completedStep++;
            localStorage.setItem(`completed_step_${savedName}`, completedStep);
            
            alert(`✅ [스태프 승인]\n[${currentTarget}] 단계가 강제 완료 처리되었습니다.`);
            
            // URL의 loc 파라미터 지우고 UI 새로고침
            const urlWithoutParams = window.location.pathname;
            window.history.replaceState({}, document.title, urlWithoutParams);
            startRoute(savedName);
        } else {
            alert("❌ 비밀번호가 올바르지 않습니다.");
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        const savedName = localStorage.getItem("route_user_name");
        const locParam = getQueryParam("loc");

        if (savedName) {
            const isExpired = checkAndClearExpiredData(savedName);
            if (!isExpired) {
                startRoute(savedName);
            } else {
                document.getElementById("errorMsg").textContent = "이전 접속 후 24시간이 지나 초기화되었습니다. 다시 이름을 입력해 주세요.";
                document.getElementById("errorMsg").style.display = "block";
            }
        } else if (locParam) {
            document.getElementById("errorMsg").textContent = "먼저 본인의 이름을 입력하여 코스를 조회해 주세요.";
            document.getElementById("errorMsg").style.display = "block";
        }
    });

    document.getElementById("nameInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") startRoute();
    });
</script>

</body>
</html>

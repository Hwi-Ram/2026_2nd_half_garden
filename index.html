<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단계별 경유지 안내</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 420px; padding: 30px 24px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        h1 { font-size: 1.4rem; color: #111; margin-bottom: 20px; text-align: center; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 24px; }
        input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus { border-color: #007bff; }
        
        .btn { padding: 12px 18px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }

        .result-box { display: none; margin-top: 10px; }
        .user-name { font-size: 1.2rem; font-weight: bold; color: #007bff; margin-bottom: 20px; text-align: center; }
        
        .timeline { position: relative; padding-left: 20px; border-left: 2px solid #e0e0e0; margin-left: 10px; }
        .step { position: relative; margin-bottom: 20px; display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        
        .step::before { content: ''; position: absolute; left: -26px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #007bff; }
        .step.destination::before { background: #28a745; width: 12px; height: 12px; left: -27px; }
        
        .label { font-size: 0.8rem; color: #666; display: block; margin-bottom: 2px; }
        .value { font-size: 1.1rem; font-weight: 600; color: #222; }
        .destination .value { color: #28a745; font-size: 1.2rem; }
        
        .guide-banner { margin-top: 20px; padding: 14px; background-color: #e7f3ff; border-radius: 8px; border-left: 4px solid #007bff; color: #004085; font-size: 0.9rem; text-align: center; line-height: 1.4; }
        .guide-banner.completed { background-color: #d4edda; border-left-color: #28a745; color: #155724; }

        .error-msg { color: #dc3545; text-align: center; font-size: 0.95rem; display: none; margin-top: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🚩 나의 목적지 찾기 🗺️</h1>
    
    <div class="input-group" id="searchArea">
        <input type="text" id="nameInput" placeholder="이름을 입력하세요 (예: 나전원)">
        <button class="btn" onclick="startRoute()">조회</button>
    </div>

    <div id="errorMsg" class="error-msg">이름을 입력해 주세요.</div>

    <div id="resultBox" class="result-box">
        <div id="userNameDisplay" class="user-name"></div>
        
        <div class="timeline">
            <div id="step1" class="step">
                <span class="label">1차 목적지</span>
                <span id="p1" class="value"></span>
            </div>
            <div id="step2" class="step">
                <span class="label">2차 목적지</span>
                <span id="p2" class="value"></span>
            </div>
            <div id="step3" class="step">
                <span class="label">3차 목적지</span>
                <span id="p3" class="value"></span>
            </div>
            <div id="step4" class="step destination">
                <span class="label">최종 목적지</span>
                <span id="dest" class="value"></span>
            </div>
        </div>

        <div id="guideBanner" class="guide-banner">
            📍 장소에 도착하여 미션을 수행한 후<br><strong>현장의 완료 QR 코드</strong>를 스캔해 주세요!
        </div>
    </div>
</div>

<script>
    // 1. 특정 참가자 맞춤 설정 (필요시 작성)
    // - 전체 고정 예시: "김태현": { p1: "...", p2: "...", p3: "...", dest: "..." }
    // - 목적지만 고정하고 경유지는 무작위로 받으려면: "지민철": { dest: "목적지 B" }
    const fixedParticipants = {
        "테스트": { p1: "첫번째", p2: "두번째", p3: "세번째", dest: "목적지" },
        "박진아": { dest: "목적지 A" },
        "유태영": { dest: "목적지 A" },
        "김소희": { dest: "목적지 A" },
        "이범교": { dest: "목적지 A" },
        "배민선": { dest: "목적지 A" },
        "윤휘람": { dest: "목적지 B" },
        "이동구": { dest: "목적지 B" },
        "이은서": { dest: "목적지 B" },
        "공소라": { dest: "목적지 B" },
        "박예찬": { dest: "목적지 B" },
        "안하원": { dest: "목적지 B" },
        "김소정": { dest: "목적지 C" },
        "석성훈": { dest: "목적지 C" },
        "윤예진": { dest: "목적지 C" },
        "홍지원": { dest: "목적지 C" },
        "배민우": { dest: "목적지 C" },
        "김혜민": { dest: "목적지 D" },
        "이시진": { dest: "목적지 D" },
        "원유진": { dest: "목적지 D" },
        "조민희": { dest: "목적지 D" },
        "성민석": { dest: "목적지 D" },
        "조건희": { dest: "목적지 D" }
    
    };

    // 2. 전체 목적지 목록 (총 4개)
    const destinationsPool = [
        "목적지 A",
        "목적지 B",
        "목적지 C",
        "목적지 D"
    ];

    // 3. 무작위 배정용 전체 경유지 후보 목록
    const waypointsPool = [
        "예루살렘", "안디옥", "수양관식당", 
        "대운동장", "바울"
    ];
const EXPIRE_TIME = 24 * 60 * 60 * 1000; // 24시간 (밀리초 단위)

    function getRandomItems(arr, count) {
        const shuffled = [...arr].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function checkAndClearExpiredData(name) {
        const savedTime = localStorage.getItem(`saved_time_${name}`); // 최초 접속 후 경로조회 시간
        const now = new Date().getTime();

        if (savedTime && (now - parseInt(savedTime) > EXPIRE_TIME)) { // 24시간 지났으면 기존 경로와 단계 초기화
            localStorage.removeItem(`route_data_${name}`);
            localStorage.removeItem(`max_step_${name}`);
            localStorage.removeItem(`saved_time_${name}`);
            
            if (localStorage.getItem("route_user_name") === name) {
                localStorage.removeItem("route_user_name");
            }
            return true;
        }
        return false;
    }

    function startRoute(providedName = null) {
        const nameInput = document.getElementById("nameInput");
        const name = providedName || nameInput.value.trim();
        const resultBox = document.getElementById("resultBox");
        const errorMsg = document.getElementById("errorMsg");

        if (!name) {
            errorMsg.textContent = "이름을 입력해 주세요.";
            errorMsg.style.display = "block";
            resultBox.style.display = "none";
            return;
        }

        const isExpired = checkAndClearExpiredData(name);
        const now = new Date().getTime();
        
        if (!localStorage.getItem(`saved_time_${name}`) || isExpired) {
            localStorage.setItem(`saved_time_${name}`, now);
        }

        localStorage.setItem("route_user_name", name);
        nameInput.value = name;

        //경로 설정
        let routeData = {};

        // 고정 데이터 및 무작위 경로 할당
        const savedRoute = localStorage.getItem(`route_data_${name}`);
        if (savedRoute) {
            routeData = JSON.parse(savedRoute);
        } else {
            let assignedDest = "";
            let assignedP1 = "", assignedP2 = "", assignedP3 = "";

            // 1) 목적지 결정
            if (fixedParticipants[name] && fixedParticipants[name].dest) {
                assignedDest = fixedParticipants[name].dest;
            } else {
                // 4개 목적지 중 1곳 무작위 추출
                assignedDest = getRandomItems(destinationsPool, 1)[0];
            }

            // 2) 경유지 결정
            if (fixedParticipants[name] && fixedParticipants[name].p1) {
                assignedP1 = fixedParticipants[name].p1;
                assignedP2 = fixedParticipants[name].p2;
                assignedP3 = fixedParticipants[name].p3;
            } else {
                // 목적지와 중복되는 경유지가 없도록 제외 처리 후 3곳 무작위 추출
                const availableWaypoints = waypointsPool.filter(item => item !== assignedDest);
                const randomWaypoints = getRandomItems(availableWaypoints, 3);
                
                assignedP1 = randomWaypoints[0];
                assignedP2 = randomWaypoints[1];
                assignedP3 = randomWaypoints[2];
            }

            routeData = {
                p1: assignedP1,
                p2: assignedP2,
                p3: assignedP3,
                dest: assignedDest
            };

            localStorage.setItem(`route_data_${name}`, JSON.stringify(routeData));
        }

        // 화면 텍스트 연결
        document.getElementById("userNameDisplay").textContent = `[ ${name} ] 님의 이동 경로`;
        document.getElementById("p1").textContent = routeData.p1;
        document.getElementById("p2").textContent = routeData.p2;
        document.getElementById("p3").textContent = routeData.p3;
        document.getElementById("dest").textContent = routeData.dest;

      // 장소 기반 QR 인증 검증 로직
        const scannedLocation = getQueryParam("loc");
        let activeStep = parseInt(localStorage.getItem(`max_step_${name}`)) || 1;
        let statusMessage = "";
        let bannerStatus = ""; // default, completed, warning

        if (scannedLocation) {
            if (activeStep === 1 && scannedLocation === routeData.p1) {
                activeStep = 2;
                statusMessage = `✅ <strong>1차 경유지 [${routeData.p1}] 인증 완료!</strong><br>다음 목적지(2차)가 열렸습니다.`;
            } else if (activeStep === 2 && scannedLocation === routeData.p2) {
                activeStep = 3;
                statusMessage = `✅ <strong>2차 경유지 [${routeData.p2}] 인증 완료!</strong><br>다음 목적지(3차)가 열렸습니다.`;
            } else if (activeStep === 3 && scannedLocation === routeData.p3) {
                activeStep = 4;
                statusMessage = `✅ <strong>3차 경유지 [${routeData.p3}] 인증 완료!</strong><br>최종 목적지가 열렸습니다.`;
            } else {
                // 잘못된 장소이거나 이미 인증한 장소인 경우
                if (scannedLocation === routeData.p1 || scannedLocation === routeData.p2 || scannedLocation === routeData.p3) {
                    statusMessage = `ℹ️ 이미 인증을 완료한 장소 [${scannedLocation}] 입니다.`;
                    bannerStatus = "warning";
                } else {
                    const nextTarget = activeStep === 1 ? routeData.p1 : (activeStep === 2 ? routeData.p2 : routeData.p3);
                    statusMessage = `⚠️ 순서에 맞지 않는 장소입니다.<br>현재 찾아가셔야 할 곳은 <strong>[${nextTarget}]</strong> 입니다.`;
                    bannerStatus = "warning";
                }
            }
            localStorage.setItem(`max_step_${name}`, activeStep);
        }

        // UI 스텝 표시
        for (let i = 1; i <= 4; i++) {
            const stepEl = document.getElementById(`step${i}`);
            if (i <= activeStep) {
                stepEl.classList.add("active");
            } else {
                stepEl.classList.remove("active");
            }
        }

        // 하단 안내 문구 제어
        const guideBanner = document.getElementById("guideBanner");
        if (activeStep === 4) {
            guideBanner.className = "guide-banner completed";
            guideBanner.innerHTML = "🎉 <strong>모든 경유지를 통과했습니다!</strong><br>최종 목적지로 집결해 주세요.";
        } else {
            guideBanner.className = "guide-banner";
            guideBanner.innerHTML = `📍 <strong>${activeStep}차 경유지</strong>에 도착하여 미션을 완료한 후<br>현장의 QR 코드를 스캔하면 다음 장소가 열립니다!`;
        }

        errorMsg.style.display = "none";
        resultBox.style.display = "block";
    }

    // 페이지 로드 시 자동 실행
    window.addEventListener("DOMContentLoaded", () => {
        const savedName = localStorage.getItem("route_user_name");
        const stepParam = getQueryParam("step");

        if (savedName) {
            const isExpired = checkAndClearExpiredData(savedName);
            if (!isExpired) {
                startRoute(savedName);
            } else {
                document.getElementById("errorMsg").textContent = "이전 접속 후 24시간이 지나 데이터가 초기화되었습니다. 다시 조회해 주세요.";
                document.getElementById("errorMsg").style.display = "block";
            }
        } else if (stepParam) {
            document.getElementById("errorMsg").textContent = "먼저 본인의 이름을 입력해 주세요.";
            document.getElementById("errorMsg").style.display = "block";
        }
    });

    document.getElementById("nameInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") startRoute();
    });
</script>

</body>
</html>
